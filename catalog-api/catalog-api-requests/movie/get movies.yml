info:
  name: get movies
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/movies?limit={{moviesLimit}}&sortBy={{moviesSortBy}}&order={{moviesOrder}}"
  params:
    - name: limit
      value: "{{moviesLimit}}"
      type: query
    - name: sortBy
      value: "{{moviesSortBy}}"
      type: query
    - name: order
      value: "{{moviesOrder}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

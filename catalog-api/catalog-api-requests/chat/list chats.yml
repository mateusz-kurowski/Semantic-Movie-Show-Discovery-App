info:
  name: list chats
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/chat?limit={{chatsLimit}}&offset={{chatsOffset}}"
  params:
    - name: limit
      value: "{{chatsLimit}}"
      type: query
    - name: offset
      value: "{{chatsOffset}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Requires authentication. Lists chats for the authenticated user, ordered by updatedAt desc. Query params: limit 1-100 (default 20), offset >=0 (default 0)."

info:
  name: list models
  type: http
  seq: 9

http:
  method: GET
  url: "{{url}}/chat/models"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires authentication. Lists the chat models available to the server's OPENAI_CHAT_KEY (a separate LiteLLM virtual key from the one used for embeddings, scoped to whatever models that key is provisioned to see). Pass one of the returned ids as `model` in POST /chat/:id/stream.

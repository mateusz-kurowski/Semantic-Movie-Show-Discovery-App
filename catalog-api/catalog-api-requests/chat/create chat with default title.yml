info:
  name: create chat with default title
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/chat"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires authentication. Creates a new chat without a title — server assigns a default title. Title is optional (1-100 chars when provided).

info:
  name: get chat by id
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/chat/:id"
  params:
    - name: id
      value: "{{chatId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires authentication. Fetches a single chat by ID including its messages ordered by createdAt asc. Set the `chatId` env var (`{{chatId}}`) to a real chat ID (cuid, e.g. cm1234567890abcdef) from create-chat. Returns 404 if not found or not owned by user.

info:
  name: create chat
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/chat"
  body:
    type: json
    data: |-
      {
        "title": "{{chatTitle}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires authentication. Creates a new chat with a custom title (1-100 chars).

info:
  name: semantic search
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/search/semantic"
  body:
    type: json
    data: |-
      {
        "phrase":"{{searchPhrase}}",
        "topK":{{topK}}
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

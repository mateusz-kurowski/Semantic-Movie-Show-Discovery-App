info:
  name: sign-out
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/auth/sign-out"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires authentication. Signs out the current session (clears the `better-auth.session_token` cookie).

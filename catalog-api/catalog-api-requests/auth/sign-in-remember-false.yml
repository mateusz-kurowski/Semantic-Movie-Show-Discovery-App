info:
  name: sign-in-remember-false
  type: http
  seq: 6

http:
  method: POST
  url: "{{url}}/auth/sign-in/email"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "email":"{{email}}",
        "password":"{{password}}",
        "rememberMe":false
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Public. Same as sign-in but with rememberMe=false: sets a session `better-auth.session_token` cookie (~1 day max) instead of a persistent cookie (~30 days). Compare with sign-in-remember-true."

info:
  name: sign-in
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/auth/sign-in/email"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "email":"{{email}}",
        "password":"{{password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

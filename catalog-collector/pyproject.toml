[project]
name = "catalog-collector"
version = "1.0.0" # x-release-please-version
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "attrs>=26.1.0",
    "httpx>=0.28.1",
    "kagglehub>=1.0.2",
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.5",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "tomli>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
